<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HaitiMapOfConflict</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="frontend/css/style.css">
  <link rel="stylesheet" href="frontend/css/sidebar.css">
  <link rel="stylesheet" href="frontend/css/legend.css">
  <link rel="stylesheet" href="frontend/css/marker-modal.css">
  <script>
    const APP_VERSION = 'v4.2';
    document.title = `HaitiMapOfConflict ${APP_VERSION}`;
  </script>
</head>

<body>
<div id="app">
<div id="map"></div>
</div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/leaflet-arrowheads@1.0.6/dist/leaflet-arrowheads.min.js"></script>
  <script>
  var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© 2025 Natcom',
  maxZoom: 19
  });

  var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: '© Esri',
  maxZoom: 22
  });
  var map = L.map('map', {
  zoomControl: false,  // ← Ẩn nút zoom mặc định
  layers: [streets] // mặc định hiển thị OSM
  });
// Thêm điều khiển chọn lớp
  var baseMaps = {
  "Street Map": streets,
  "Vệ tinh": satellite
  };
L.control.layers(baseMaps).addTo(map);
</script>


<script src="frontend/scripts/core/app_state.js?v=20260313a"></script>

</body>
</html>
